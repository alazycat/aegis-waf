# Basic request-inspection rules for aegis-waf v0.1.

SecAction "id:1000,phase:1,pass,setvar:tx.anomaly_score=0,nolog"

SecRule REQUEST_METHOD "!@pm GET POST HEAD OPTIONS" \
    "id:1001,phase:1,deny,status:405,msg:'Request method not allowed',log"

SecRule ARGS "@rx (?i)(union\s+select|select\s+.*\s+from|'\s*or\s*'1'='1)" \
    "id:942100,phase:2,deny,status:403,msg:'SQL injection pattern',severity:'CRITICAL',tag:'attack-sqli',log,t:urlDecodeUni,t:lowercase"

SecRule ARGS "@rx (?i)(<script|javascript:|onerror\s*=)" \
    "id:941100,phase:2,deny,status:403,msg:'XSS pattern',severity:'CRITICAL',tag:'attack-xss',log,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase"

SecRule REQUEST_URI "@contains ../" \
    "id:930100,phase:1,deny,status:403,msg:'Path traversal pattern',severity:'CRITICAL',tag:'attack-lfi',log"

SecRule REQUEST_HEADERS:User-Agent "@pm sqlmap nikto nmap masscan" \
    "id:913100,phase:1,pass,setvar:tx.anomaly_score=+5,msg:'Scanner user agent',tag:'scanner',log"

SecRule TX:ANOMALY_SCORE "@ge 10" \
    "id:949110,phase:2,deny,status:403,msg:'Anomaly score exceeded: %{tx.anomaly_score}',severity:'CRITICAL',tag:'anomaly',log"
