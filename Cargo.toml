[workspace]
resolver = "2"
members = ["crates/aegis-engine", "crates/aegis-proxy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
http = "1"
regex = "1"
regex-syntax = "0.8"
aho-corasick = "1"
ipnet = "2"
form_urlencoded = "1"
html-escape = "0.2"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
arc-swap = "1"
glob = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
proptest = "1"
